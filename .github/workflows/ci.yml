name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint tools
        run: pip install ruff==0.4.4 black==24.4.2 isort==5.13.2
      - name: Run ruff
        run: ruff check .
      - name: Check formatting (black)
        run: black --check .
      - name: Check import order (isort)
        run: isort --check-only .

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cozy
          POSTGRES_PASSWORD: cozy
          POSTGRES_DB: test_cozy_reads
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cozy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-secret-not-for-production-use-xyz123
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_USER: cozy
      POSTGRES_PASSWORD: cozy
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      REDIS_URL: redis://localhost:6379/1
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements/local.txt
      - name: Install dependencies
        run: pip install -r requirements/local.txt
      - name: Run migrations
        run: python manage.py migrate
      - name: Run tests
        run: pytest -v

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f docker/django/Dockerfile -t cozy-reads-api:ci .